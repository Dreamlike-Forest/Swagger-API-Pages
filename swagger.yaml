---
openapi: 3.1.0
info:
  title: 몽향 API Doc
  description: 몽향 프로젝트 API 문서(개발 중)
  version: 1.0.0
servers:
  description: Generated server url
tags:
- name: 태그 조회 API
  description: '페이지 단위: 10개'
- name: 태그 카테고리 조회 API
  description: '페이지 단위: 10개'
- name: 양조장 관리자용 API
  description: 양조장 권한을 가진 회원만 접근할 수 있습니다.
- name: Community
  description: 커뮤니티 API
- name: 장바구니 API
  description: '장바구니 수량 유효 범위: 1 ~ 99'
- name: 판매자 관리자용 API
  description: 양조장 및 판매자 권한을 가진 회원만 접근할 수 있습니다.
- name: Follow
  description: 팔로우 API
- name: Comment
  description: 댓글 API
- name: Community Image
  description: 커뮤니티 이미지 API
paths:
  "/api/user/update":
    post:
      tags:
      - 회원 공통 API
      summary: 회원 수정 api
      description: 비밀번호 변경 시 '기존 비밀번호'와 '새 비밀번호'를 각각의 필드에 입력하여 전송해주셔야 합니다. 수정 성공 시
        해당 유저의 모든 로그인 상태 정보가 서버에서 제거됩니다.
      operationId: updateUsers
      parameters:
      - name: userId
        in: query
        required: true
        schema:
          type: integer
          format: int64
      - name: userRole
        in: query
        required: true
        schema:
          type: string
      - name: reqUsersDto
        in: query
        required: true
        schema:
          "$ref": "#/components/schemas/ReqUsersDto"
      responses:
        '200':
          description: OK
          content:
            "*/*":
              schema:
                "$ref": "#/components/schemas/ResponseDataDtoVoid"
  "/api/seller-priv/update":
    post:
      tags:
      - 판매자 관리자용 API
      summary: 판매자 테이블에 대한 정보 수정
      operationId: updateSeller
      parameters:
      - name: userId
        in: query
        required: true
