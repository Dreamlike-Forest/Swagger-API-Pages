          type: string
          format: date
        gender:
          type: string
        address:
          type: string
        address_detail:
          type: string
    ResponseDataDtoVoid:
      type: object
      properties:
        status:
          type: integer
          format: int32
        message:
          type: string
        content:
          type: object
    AddImageDto:
      type: object
      properties:
        image:
          type: string
          format: binary
        seq:
          type: integer
          format: int32
    ModifySeqImageDto:
      type: object
      properties:
        image_id:
          type: integer
          format: int64
        seq:
          type: integer
          format: int32
    ReqSellerDto:
      type: object
      properties:
        seller_name:
          type: string
        seller_address:
          type: string
        seller_address_detail:
          type: string
        business_registration_number:
          type: string
        seller_account_number:
          type: string
        seller_depositor:
          type: string
        seller_bank_name:
          type: string
        introduction:
          type: string
        add_images:
          type: array
          items:
            "$ref": "#/components/schemas/AddImageDto"
        modify_images:
          type: array
          items:
            "$ref": "#/components/schemas/ModifySeqImageDto"
        remove_images:
          type: array
          items:
            type: integer
            format: int64
    VerifyAuthDto:
      type: object
      properties:
        password:
          type: string
      required:
      - password
    UpdateProductDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        alcohol:
          type: number
          format: double
        is_online_sell:
          type: boolean
        volume:
          type: integer
          format: int32
          minimum: 1
        origin_price:
          type: number
        discount_rate:
          type: number
        is_soldout:
          type: boolean
        description:
          type: string
        add_images:
          type: array
          items:
            "$ref": "#/components/schemas/AddImageDto"
        modify_images:
          type: array
          items:
            "$ref": "#/components/schemas/ModifySeqImageDto"
        remove_images:
          type: array
          items:
            type: integer
            format: int64
      required:
      - id
    ReqTagDto:
      type: object
      properties:
        add_tag_list:
          type: array
          items:
            type: integer
            format: int32
        delete_tag_list:
          type: array
          items:
            type: integer
            format: int32
    ReqProductDto:
      type: object
      properties:
        name:
